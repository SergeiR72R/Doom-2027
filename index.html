<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DOOM 2027 — E1M1</title>
<style>
  :root { --red: #c8200e; --red2: #ff5a2a; --metal: #2a2522; --text: #e8dccb; }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; color: var(--text);
    font-family: Impact, 'Haettenschweiler', 'Arial Narrow Bold', 'Arial Black', sans-serif; }
  canvas { position: fixed; inset: 0; display: block; }
  #view { cursor: crosshair; }
  #hud { pointer-events: none; }
  #menu { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; z-index: 10; }
  #menu.visible { display: flex; }
  #menu.dim { background: rgba(0, 0, 0, 0.62); }
  #menu.title-screen { background: radial-gradient(ellipse at center, rgba(0,0,0,0.15) 0%, rgba(0,0,0,0.75) 75%); }
  .title, .panel, .loading { text-align: center; padding: 16px; max-width: min(720px, calc(100vw - 32px)); }
  .logo { font-size: clamp(64px, 15vw, 190px); line-height: 0.9; letter-spacing: 0.02em; font-weight: 900;
    background: linear-gradient(180deg, #ffd6a0 0%, #ff8a2a 30%, #c8200e 60%, #4a0800 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 4px 0 #1a0400) drop-shadow(0 0 28px rgba(255, 60, 10, 0.55));
    transform: perspective(500px) rotateX(14deg); }
  .logo span { display: block; font-size: 0.34em; letter-spacing: 0.45em; margin-right: -0.45em;
    background: linear-gradient(180deg, #e8e8f0, #8a8a9a 60%, #3a3a44); -webkit-background-clip: text; background-clip: text; }
  .logo.small { font-size: 72px; }
  .sub { margin: 18px 0 28px; letter-spacing: 0.3em; color: #c8b8a0; font-size: 18px; text-shadow: 0 2px 4px #000; }
  .foot { margin-top: 30px; font-family: system-ui, sans-serif; font-size: 12px; color: #8a8070; }
  .buttons { display: flex; flex-direction: column; gap: 10px; align-items: center; }
  button { font: inherit; font-size: 26px; letter-spacing: 0.06em; color: #f0d8c0; cursor: pointer; min-width: 300px;
    background: linear-gradient(180deg, #4a4038, #2a2420 55%, #1a1614); border: 2px solid #5a4e44; border-radius: 3px;
    padding: 8px 26px; text-shadow: 0 2px 0 #000; box-shadow: inset 0 1px 0 rgba(255,255,255,0.12), 0 4px 10px rgba(0,0,0,0.6);
    transition: transform .08s, color .08s, border-color .08s; }
  button:hover, button:focus { color: #fff; border-color: var(--red2); outline: none; transform: translateY(-1px);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.15), 0 0 18px rgba(255, 70, 20, 0.45); }
  .skills button { font-size: 22px; min-width: 380px; }
  button.back { margin-top: 18px; font-size: 18px; min-width: 160px; }
  .panel { background: linear-gradient(180deg, rgba(40,34,30,0.94), rgba(18,15,13,0.96)); border: 2px solid #4a3e36;
    border-radius: 4px; padding: 26px 34px; box-shadow: 0 10px 40px rgba(0,0,0,0.8); }
  h2 { font-size: 40px; margin: 0 0 20px; color: var(--red); text-shadow: 0 3px 0 #200, 0 0 18px rgba(255,40,0,0.35); letter-spacing: 0.06em; }
  h3 { margin: 0; font-size: 28px; color: #e8d0b0; letter-spacing: 0.2em; }
  .options .grid { display: grid; gap: 8px; text-align: left; font-family: system-ui, sans-serif; font-size: 15px; }
  .row { display: grid; grid-template-columns: 1fr auto 46px; gap: 12px; align-items: center; padding: 4px 6px; border-bottom: 1px solid rgba(255,255,255,0.06); }
  .row em { font-style: normal; color: #aa9; font-size: 13px; text-align: right; }
  .row input[type=range] { width: 180px; accent-color: var(--red); }
  .row input[type=checkbox] { width: 20px; height: 20px; accent-color: var(--red); }
  .row select { font: inherit; background: #1a1614; color: var(--text); border: 1px solid #5a4e44; padding: 3px 6px; }
  .note { font-family: system-ui, sans-serif; font-size: 13px; color: #a09080; margin: 14px 0 6px; }
  table.controls { font-family: system-ui, sans-serif; font-size: 15px; border-collapse: collapse; text-align: left; margin: 0 auto; }
  table.controls td { padding: 6px 12px; border-bottom: 1px solid rgba(255,255,255,0.07); }
  table.controls td:first-child { color: #ffb070; white-space: nowrap; }
  table.stats { margin: 10px auto 22px; font-size: 34px; border-collapse: collapse; }
  table.stats td { padding: 4px 22px; text-align: left; color: var(--red); text-shadow: 0 2px 0 #200; }
  table.stats td:last-child { text-align: right; color: #ffcf6a; min-width: 120px; }
  .loading p { font-family: system-ui, sans-serif; color: #a09080; letter-spacing: 0.1em; }
  @media (max-width: 520px) { button, .skills button { min-width: 0; width: 100%; font-size: 20px; } .row { grid-template-columns: 1fr auto; } .row em { display: none; } }
</style>
</head>
<body>
  <canvas id="view"></canvas>
  <canvas id="hud"></canvas>
  <div id="menu" class="visible"><div class="loading"><p>Loading…</p></div></div>
  <script src="dist/doom.js"></script>
</body>
</html>
